name: 학교 자료 자동 갱신

on:
  schedule:
    - cron: '0 21 * * 0-4'   # 월~금 오전 6시 (한국 시간)
    - cron: '0 4 * * 1-5'    # 월~금 오후 1시 (한국 시간)
  workflow_dispatch:          # Actions 탭에서 "Run workflow" 로 바로 실행
  push:
    branches: [main]
    paths: ['data/*.hwpx', 'config.json']

permissions:
  contents: write

concurrency:
  group: update-school-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 준비
        run: npm install --no-audit --no-fund
      - name: 시트·학사일정 읽어서 data/*.json 만들기
        run: node scripts/build.mjs
      - name: 바뀐 내용 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/school.json data/acad.json
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "학교 자료 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            git push
          fi
