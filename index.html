<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학교 캘린더</title>
<meta name="theme-color" content="#0f766e">
<meta name="description" content="학사일정·주간계획·월중행사와 내 시간표를 한눈에 보는 학교 캘린더">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --a:.72;--blur:14px;--bg-rgb:246 244 239;--panel-rgb:255 253 249;--panel2-rgb:241 238 231;
  --bg:rgb(var(--bg-rgb)/calc(var(--a)*.55));--panel:rgb(var(--panel-rgb)/var(--a));--panel2:rgb(var(--panel2-rgb)/calc(var(--a)*.85));--panel-solid:rgb(var(--panel-rgb));--ink:#1d1d1f;--muted:#6d6a64;--faint:#a29e96;--line:#e5e0d6;
  --accent:#0f766e;--accent-soft:#dcefea;--acad:#0e7490;--annual:#b45309;--weekly:#4f46e5;--holi:#d62f2f;--sat:#2563eb;
  --chg:#d9480f;--chg-soft:#ffe8d6;--cancel:#8a8780;--now:#0f766e;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --r:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg-rgb:23 24 26;--panel-rgb:31 32 35;--panel2-rgb:38 39 43;--ink:#ecebe7;--muted:#a3a19b;--faint:#6d6b66;--line:#33343a;
  --accent:#2dd4bf;--accent-soft:#1d3a37;--acad:#22d3ee;--annual:#f59e0b;--weekly:#8b84ff;--holi:#f87171;--sat:#60a5fa;
  --chg:#fb923c;--chg-soft:#3d2a1c;--cancel:#7d7b76;--now:#2dd4bf;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{background:transparent}
body{background-attachment:fixed!important;background-size:cover!important;background-position:center!important;font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:248px 1fr;height:100vh}
/* sidebar */
#side{border-right:1px solid var(--line);padding:18px 16px;overflow:auto;background:var(--panel);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:16px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.newbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-weight:600;margin-bottom:18px}
.newbtn:hover{border-color:var(--accent)}
.mini{margin-bottom:18px}
.mini-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px;font-size:13px}
.mini-h button{border:0;background:none;padding:2px 6px;border-radius:6px;color:var(--muted)}
.mini-h button:hover{background:var(--panel2)}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:11.5px}
.mini-g .dn{color:var(--faint);padding:2px 0}
.mini-g button{border:0;background:none;aspect-ratio:1;border-radius:50%;padding:0;position:relative;font-size:11.5px}
.mini-g button:hover{background:var(--panel2)}
.mini-g button.out{color:var(--faint)}
.mini-g button.sun{color:var(--holi)}.mini-g button.sat{color:var(--sat)}
.mini-g button.today{background:var(--accent);color:#fff;font-weight:700}
.mini-g button.sel:not(.today){outline:1.5px solid var(--accent)}
.mini-g button.dot::after{content:"";position:absolute;bottom:2px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--annual)}
.sec{margin-bottom:16px}
.sec h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;cursor:pointer;user-select:none}
.chk:hover{background:var(--panel2)}
.chk input{display:none}
.chk .box{width:15px;height:15px;border-radius:4px;border:2px solid var(--c,var(--accent));flex:none;display:grid;place-items:center}
.chk input:checked+.box{background:var(--c,var(--accent))}
.chk input:checked+.box::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk .lbl{flex:1;font-size:13px}
.side-note{font-size:11.5px;color:var(--muted);margin-top:4px;padding:0 6px}
/* main */
main{display:flex;flex-direction:column;min-width:0;height:100vh}
#top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
#top .title{font-size:19px;font-weight:600;margin:0 6px;white-space:nowrap}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.ibtn:hover{background:var(--panel2)}
.ibtn.round{border-radius:50%;width:32px;height:32px;padding:0;justify-content:center}
.ibtn.on{background:var(--ink);color:var(--panel-solid);border-color:var(--ink)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.tabs button{border:0;background:var(--panel);padding:6px 13px;font-size:13px;border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.save{font-size:12px;color:var(--muted);min-width:70px;text-align:right}
.save.err{color:var(--holi)}
.menubtn{display:none}
#view{flex:1;overflow:auto;padding:20px}
.banner{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;gap:10px;align-items:center}
.banner.priv{background:var(--ink);color:var(--panel-solid);border-color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.wk,.mo{backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}.small{font-size:12px}
/* day */
.day-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;max-width:1100px}
.now{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:18px 20px;border-radius:var(--r);background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.now{color:#0b1f1d}}
.now .big{font-size:22px;font-weight:700;line-height:1.25}
.now .meta{opacity:.85;font-size:13px;margin-top:2px}
.now .ring{margin-left:auto;text-align:right;font-size:12px;opacity:.9}
.now .ring{white-space:nowrap}.now .ring b{display:block;font-size:26px;line-height:1}
.banner .linkbtn{white-space:nowrap}
table.bt input::placeholder{color:var(--faint);opacity:.55}
.now.off{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.tt{display:flex;flex-direction:column;gap:6px}
.tt-row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;width:100%}
.tt-row:hover{border-color:var(--accent)}
.tt-row .pn{font-weight:600;font-size:13px}
.tt-row .pt{font-size:11.5px;color:var(--muted);display:block;font-weight:400}
.tt-row .sj{font-size:15px;font-weight:500}
.tt-row .sj.empty{color:var(--faint);font-weight:400;font-size:13px}
.tt-row .was{font-size:11.5px;color:var(--muted);text-decoration:line-through;margin-left:6px}
.tt-row.chg{background:var(--chg-soft);border-color:color-mix(in srgb,var(--chg) 40%,transparent)}
.tt-row.cur{border:2px solid var(--now);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 18%,transparent)}
.tt-row.past{opacity:.55}
.tt-row.dim{opacity:.45}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--chg);color:#fff;white-space:nowrap}
.tag.cx{background:var(--cancel)}
.tag.nw{background:var(--now)}
.list{display:flex;flex-direction:column;gap:6px}
.empty-note{color:var(--faint);font-size:13px;padding:6px 2px}
.qa{display:flex;gap:6px;margin-top:10px}
.qa input{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px}
.qa input:focus{outline:2px solid var(--accent);border-color:transparent}
/* chips */
.chip{display:flex;align-items:center;gap:6px;border:0;width:100%;text-align:left;font-size:12px;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink);cursor:pointer;line-height:1.35;min-width:0}
.chip::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip .tm{color:var(--muted);font-size:11px;flex:none}
.chip:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.chip.hid{opacity:.5;font-style:italic}
.chip.hid .t::before{content:"🙈 ";font-style:normal}
.chip.lg{font-size:13.5px;padding:8px 10px;border-radius:9px}
.chip.lg .tm{font-size:12px}
.chip .nt{display:block;color:var(--muted);font-size:11.5px;white-space:normal}
/* week */
.wk{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);min-width:720px}
.wk>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-width:0}
.wk .hd{text-align:center;padding:10px 4px;background:var(--panel2)}
.wk .hd .d{font-size:20px;font-weight:600;line-height:1.1}
.wk .hd .w{font-size:12px;color:var(--muted)}
.wk .hd.today .d{color:var(--accent)}
.wk .hd.today{box-shadow:inset 0 -3px 0 var(--accent)}
.wk .hd .hn{font-size:11px;color:var(--holi)}
.wk .rl{font-size:12px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;background:var(--panel2);text-align:center;padding:6px 2px}
.wk .rl b{color:var(--ink);font-weight:600;font-size:13px}
.wk .cell{cursor:pointer;font-size:13px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:48px}
.wk .cell:hover{background:var(--panel2)}
.wk .cell.chg{background:var(--chg-soft)}
.wk .cell.cur{box-shadow:inset 0 0 0 2px var(--now)}
.wk .cell .was{font-size:11px;color:var(--muted);text-decoration:line-through}
.wk .cell .e{color:var(--faint)}
.wk .col-today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.wk .stack{display:flex;flex-direction:column;gap:3px}
.wk .addz{cursor:copy}
/* month */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);min-width:640px}
.mo .dh{text-align:center;font-size:12px;padding:7px 0;color:var(--muted);background:var(--panel2);border-bottom:1px solid var(--line)}
.mo .dh.sun{color:var(--holi)}.mo .dh.sat{color:var(--sat)}
.mo .dc{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px 6px;display:flex;flex-direction:column;gap:2px;cursor:copy;min-width:0}
.mo .dc:nth-child(7n+7){border-right:0}
.mo .dc.out{background:rgb(var(--panel2-rgb)/calc(var(--a)*.5))}
.mo .dc.out .num{color:var(--faint)}
.mo .num{border:0;background:none;font-size:12.5px;font-weight:600;align-self:flex-start;padding:2px 6px;border-radius:999px;display:flex;gap:6px;align-items:center}
.mo .num:hover{background:var(--panel2)}
.mo .num .hn{font-size:10.5px;font-weight:500;color:var(--holi)}
.mo .dc.sun .num,.mo .dc.hol .num{color:var(--holi)}
.mo .dc.sat .num{color:var(--sat)}
.mo .dc.today .num b{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin:0 -6px}
.mo .more{border:0;background:none;font-size:11.5px;color:var(--muted);text-align:left;padding:1px 6px}
.mo .more:hover{color:var(--ink)}
.mo .chgdot{font-size:10.5px;color:var(--chg);font-weight:600;padding:0 6px}
/* year */
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.yr .card{cursor:pointer;padding:14px}
.yr .card:hover{border-color:var(--accent)}
.yr h3{font-size:15px}
.yr .row{display:flex;gap:8px;font-size:12.5px;padding:2px 0}
.yr .row .dd{color:var(--muted);width:62px;flex:none;font-variant-numeric:tabular-nums}
.yr .row.h{color:var(--holi)}
.yr .row .tx{overflow:hidden;text-overflow:ellipsis}
/* settings */
.set{max-width:920px;display:flex;flex-direction:column;gap:16px}
.set p.desc{margin:-4px 0 12px;color:var(--muted);font-size:12.5px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;color:var(--ink);font-size:13.5px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid var(--accent);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
table.bt{border-collapse:collapse;width:100%}
table.bt th,table.bt td{border:1px solid var(--line);padding:4px;text-align:center;font-size:12.5px}
table.bt th{background:var(--panel2);font-weight:600;color:var(--muted)}
table.bt input{width:100%;border:0;background:transparent;padding:6px 4px;text-align:center;border-radius:6px}
table.bt input:focus{outline:2px solid var(--accent);background:var(--panel)}
table.bt input[type=time]{min-width:92px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;font-size:13px}
.btn:hover{background:var(--panel2)}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn.primary{color:#0b1f1d}}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--holi);border-color:color-mix(in srgb,var(--holi) 40%,transparent)}
.btn.sm{padding:4px 9px;font-size:12px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.catrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.catrow input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none}
/* modal */
.mb{position:fixed;inset:0;background:rgba(20,20,20,.38);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.md{background:rgb(var(--panel-rgb)/.97);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(480px,100%);padding:20px 22px;position:relative}
.md.wide{width:min(900px,100%)}
.md h2{margin:0 0 14px;font-size:17px}
.md .x{position:absolute;right:12px;top:12px;border:0;background:none;font-size:20px;color:var(--muted);width:32px;height:32px;border-radius:8px}
.md .x:hover{background:var(--panel2)}
.md .stack{display:flex;flex-direction:column;gap:11px}
.md .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
.md .actions .left{margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.titlein{font-size:17px!important;padding:9px 10px!important}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--ink)}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 10px}
.src{display:flex;gap:10px;align-items:stretch}
.src textarea{flex:1;min-height:64px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;background:var(--panel2);resize:vertical;font-size:12.5px}
.filebtn{display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px dashed var(--accent);color:var(--accent);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:13px;width:150px;flex:none}
.filebtn:hover{background:var(--accent-soft)}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.prev{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prev table{border-collapse:collapse;width:100%;font-size:12px}
.prev td,.prev th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.prev th{position:sticky;top:0;background:var(--panel2);font-weight:600}
.prev tr.hdr td{background:var(--accent-soft);font-weight:600}
.okline{font-size:13px;margin:10px 0 6px;font-weight:600}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel-solid);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
#toast.on{opacity:1}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:transparent;z-index:90;color:var(--muted);font-size:14px}
.welcome{grid-column:1/-1;border:1.5px dashed var(--accent);background:var(--accent-soft)}
.welcome ol{margin:6px 0 4px;padding-left:20px}
.welcome li{margin:4px 0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  #side.open{transform:none}
  .menubtn{display:inline-flex}
  .day-wrap{grid-template-columns:1fr}
  #top{padding:10px 12px;gap:6px}
  #top .title{font-size:16px}
  .tabs{margin-left:0;order:9;width:100%}
  .tabs button{flex:1}
  #view{padding:12px}
  .src{flex-direction:column}.filebtn{width:auto}
}
.dept{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px;font-style:normal;white-space:nowrap}
details.sec summary{cursor:pointer;font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:6px;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:" ▾"}
.sync{font-size:11.5px;color:var(--muted);padding:2px 6px}
.sync.err{color:var(--holi)}
.yr .card{max-height:340px;overflow:auto}
input[type=range]{accent-color:var(--accent);width:100%}
.gsrow{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.gsstat{font-size:12px;color:var(--muted);grid-column:2/-1;margin-top:-4px}
.gsstat.err{color:var(--holi)}
.tt-row.ac{background:color-mix(in srgb,var(--acad) 11%,transparent);border-color:color-mix(in srgb,var(--acad) 35%,transparent)}

'2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-08-15':'광복절','2027-08-16':'대체공휴일',

/* ---------- 부서별 양식 파서 ---------- */
function csvRows(text,delim){
  delim=delim||',';const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===delim){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}

}
function mdTableRows(text){
  return text.split(/\r?\n/).filter(l=>/^\s*\|/.test(l)&&!/^\s*\|[\s:|-]+\|\s*$/.test(l))
    .map(l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim().replace(/<br\s*\/?>/gi,'\n')));
}
/* text: "## Sheet name: X\n...csv..." blocks -> [{name, rows}] */
function splitSheets(text){
  const out=[];const re=/^##\s*Sheet name:\s*(.*)$/gm;let m;const marks=[];
  while((m=re.exec(text)))marks.push({name:m[1].trim(),start:m.index,body:re.lastIndex});
  marks.forEach((k,i)=>{const body=text.slice(k.body,i+1<marks.length?marks[i+1].start:text.length).replace(/^\r?\n/,'');
    const rows=/^\s*\|/m.test(body)&&!/^[^|\n]*,/.test(body.split('\n').find(l=>l.trim())||'')?mdTableRows(body):csvRows(body);
    out.push({name:k.name,rows})});
  return out;
}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function splitItems(cell){
  const lines=String(cell??'').split(/\r?\n/);const items=[];let cur=null;
  for(let raw of lines){const l=raw.trim();if(!l)continue;
    if(/^[ㆍ·•▪◦]/.test(l)||cur===null){if(cur)items.push(cur);cur=l.replace(/^[ㆍ·•▪◦]\s*/,'')}
    else cur+=(/[(\[,/~-]$/.test(cur)||/^[)\],]/.test(l)?'':' ')+l}
  if(cur!=null)items.push(cur);
  return items.map(s=>s.replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').trim()).filter(s=>s&&s!=='-'&&s!=='ㆍ');
}
/* Parse department-format sheets. opts: {schoolYear, kind, periods:[{n,start}]} -> {items, cover:[[from,to]], sheets} */
function parseDeptSheets(sheets,opts){
  const sy=opts.schoolYear;const yOf=mo=>mo>=3?sy:sy+1;
  const mk=(y,mo,d)=>{if(mo<1||mo>12||d<1||d>31)return null;const x=new Date(y,mo-1,d);if(x.getMonth()!==mo-1)return null;
    return `${x.getFullYear()}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
  const items=[],cover=[];let used=0;const seen={};
  for(const sh of sheets){
    const rows=sh.rows;const hi=rows.findIndex(r=>String(r[0]||'').trim()==='일'&&/요일/.test(String(r[1]||'')));
    if(hi<0)continue;
    const depts=rows[hi].map(c=>String(c||'').replace(/\s+/g,'').trim());
    const sm=(sh.name+' '+(rows[0]||[]).join(' ')).match(/(\d{1,2})\s*월/);if(!sm)continue;

    for(const r of rows.slice(hi+1)){

function hwpNodeText(n){let s='';for(const c of n.childNodes){if(c.nodeType===3)s+=c.nodeValue;else if(c.nodeType===1){const l=c.localName;if(l==='fwSpace'||l==='nbSpace'||l==='tab'||l==='lineBreak')s+=' ';else if(l!=='tbl')s+=hwpNodeText(c)}}return s}
function hwpTables(xml){

function parseGenericSheets(sheets,kind){
  const items=[],seen={};
  for(const sh of sheets){const rows=sh.rows;let hi=-1,dc=-1,tc=-1,tmc=-1,nc=-1;
    for(let i=0;i<Math.min(12,rows.length);i++){const r=rows[i].map(c=>String(c??''));const d=r.findIndex(h=>/날짜|일자|일시|월일|date/i.test(h));const t=r.findIndex(h=>/내용|행사|일정|업무|제목|활동/.test(h));
      if(d>=0&&t>=0){hi=i;dc=d;tc=t;tmc=r.findIndex(h=>/시간|시각|교시/.test(h));nc=r.findIndex(h=>/장소|비고|담당|대상|부서/.test(h));break}}
    if(hi<0)continue;let last=null;
    for(const r of rows.slice(hi+1)){let dr=parseDateCell(r[dc]);if(!dr&&last&&String(r[dc]??'').trim()==='')dr=last;if(dr)last=dr;
      const title=String(r[tc]??'').trim().replace(/\s*\n\s*/g,' ');if(!dr||!title)continue;const key=kind+dr[0]+title;seen[key]=(seen[key]||0)+1;
      items.push({id:'m'+hashStr(key+'|'+seen[key]),kind,date:dr[0],end:dr[1]||'',time:tmc>=0?parseTime(r[tmc]):'',title,note:nc>=0?String(r[nc]??'').trim():'',dept:'',src:'gsheet'})}}
  return{items,cover:[],sheets:sheets.length};
}
function applyMySheet(k,cache){

  S.school=S.school.filter(x=>!(x.src==='gsheet'&&x.kind===k)).concat(cache.items.map(x=>({...x,kind:k,src:'gsheet'})));
  SHARED.cover[k]=cache.cover||[];SHARED.counts[k]=cache.items.length;return true;
}
async function fetchMySheet(k,quiet){
  const id=S.settings.mySheets[k];if(!id)return;
  if(typeof XLSX==='undefined'){MYS.err[k]='엑셀 읽기 도구를 불러오지 못했어요. 새로고침해 주세요.';return}
  MYS.busy[k]=true;MYS.err[k]='';if(S.view==='settings')render();
  try{
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/export?format=xlsx`);
    if(!r.ok)throw new Error('시트를 받지 못했어요 ('+r.status+')');
    const buf=await r.arrayBuffer();const head=new Uint8Array(buf.slice(0,2));
    if(!(head[0]===0x50&&head[1]===0x4b))throw new Error('시트를 읽을 수 없어요. 공유를 "링크가 있는 모든 사용자"로 바꿔 주세요.');
    const wb=XLSX.read(buf,{type:'array'});
    const sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''})}));
    let res=parseDeptSheets(sheets,{schoolYear:S.settings.schoolYear,kind:k,periods:periods()});
    if(!res.items.length)res=parseGenericSheets(sheets,k);
    if(!res.items.length)throw new Error('시트에서 날짜·내용 표를 찾지 못했어요. "일·요일·부서" 또는 "날짜·내용" 제목 줄이 있는지 확인해 주세요.');
    const cache={at:Date.now(),items:res.items.map(({src,...x})=>x),cover:res.cover};
    try{localStorage.setItem('tcal.mysheet.'+k,JSON.stringify(cache))}catch(e){}
    applyMySheet(k,cache);if(!quiet)toast(`${k==='weekly'?'주간 업무계획':'월중 행사계획'} ${res.items.length}건을 불러왔어요`);
  }catch(e){MYS.err[k]=(e&&e.message&&!/Failed to fetch/.test(e.message))?e.message:'시트를 불러오지 못했어요. 인터넷 연결과 공유 설정을 확인해 주세요.'}
  MYS.busy[k]=false;if(!$$('.mb').length)render();
}

const Store={mode:'local',db:null,uid:null,
  async init(){return;
    let tries=0;while(!(window.claude&&window.claude.use)&&tries<15){await new Promise(r=>setTimeout(r,100));tries++}
    if(!(window.claude&&window.claude.use))return;

      const [db,user]=await Promise.all([withTimeout(window.claude.use('db'),11000).catch(()=>null),withTimeout(window.claude.use('user'),11000).catch(()=>null)]);
      if(db&&user){const id=await user.id();if(id){this.db=db;this.uid=id;this.mode='cloud'}}
    }catch(e){}
  },
  col(){return this.db.collection('data/users/'+this.uid)},

    if(this.mode==='cloud'){
      let last;

        try{const snap=await withTimeout(this.col().limit(1000).get(),25000);
          const out={};snap.docs.forEach(d=>{if(d.exists)out[d.id]=d.data()});return out}

function hydrate(docs){
  for(const [k,v] of Object.entries(docs)){
    if(!v)continue;
    try{hydrateOne(k,v)}catch(e){console.warn('문서를 읽지 못함',k,e)}
  }
}
function hydrateOne(k,v){{

      S.settings.mySheets=Object.assign({weekly:'',annual:''},S.settings.mySheets||{});

      if(!Array.isArray(S.settings.periods))S.settings.periods=defaultPeriods();

const dirty=new Set();let flushTimer=null,flushing=false,errShown=false;

async function flush(){
  if(flushing){clearTimeout(flushTimer);flushTimer=setTimeout(flush,400);return}
  flushing=true;
  try{
    while(dirty.size){
      const key=dirty.values().next().value;dirty.delete(key);
      try{await Store.write(key,buildDoc(key))}
      catch(e){
        dirty.add(key);setSave('error');

    }

}

/* ---------- queries ---------- */
const periods=()=>S.settings.periods||[];
const pLabel=p=>p.label||`${p.n}교시`;
function baseTextDow(w,n){return ((S.base[w]||{})[n]||{}).text||''}
function baseText(dstr,n){return baseTextDow(parseYmd(dstr).getDay(),n)}
const gradeOf=t=>{const m=String(t||'').match(/^\s*(\d)\s*-\s*\d/);return m?+m[1]:null};
function slotFor(dstr,n){
  n=+n;const b=baseText(dstr,n);const c=(S.changes[dstr]||{})[n];
  if(c)return{text:c.cancel?'':c.text,cancel:!!c.cancel,changed:true,base:b,src:c.src};
  const r=S.settings.layers.acad!==false?ACADX.rule(dstr):null;
  if(r){
    let src=null;if(r.map&&r.map[n])src=baseTextDow(r.map[n].dow,r.map[n].p);else if(r.dow!=null)src=baseTextDow(r.dow,n);
    const cand=src!=null?src:b;const ev=r.ev&&r.ev[n];
    if(ev&&(!ev.g||(gradeOf(cand)&&ev.g.includes(gradeOf(cand)))))return{text:ev.t,changed:true,acad:true,event:true,base:b};
    if(r.cut&&n>r.cut&&!(r.map&&r.map[n]))return{text:'',cancel:true,changed:true,acad:true,base:b};
    if(src!=null&&src!==b)return{text:src,changed:true,acad:true,base:b};
  }
  return{text:b,changed:false,base:b};
}
function dayHasClasses(dstr){return periods().some(p=>slotFor(dstr,p.n).text)}
function offName(d){if(HOLI[d])return HOLI[d];
  const a=ACADX.items().find(x=>x.noClass&&!/방학/.test(x.title)&&d>=x.date&&d<=(x.end||x.date));if(a)return a.title;
  const sc=S.school.find(x=>/재량\s*휴업/.test(x.title)&&x.title.length<=12&&d>=x.date&&d<=(x.end||x.date));return sc?sc.title.trim():null}
function holidayOf(d){return S.settings.layers.holiday?offName(d):null}
function weeklyCovers(d){return (SHARED.cover.weekly||[]).some(([a,b])=>d>=a&&d<=b)}
function deptVisible(x){return !x.dept||!S.settings.hiddenDepts.includes(x.dept)}
function schoolOn(d,ignoreDedupe){
  const L=S.settings.layers;const ded=!ignoreDedupe&&L.weekly&&S.settings.hideAnnualInWeekly&&weeklyCovers(d);
  const ac=L.acad===false?[]:ACADX.items().filter(x=>x.title&&d>=x.date&&d<=(x.end||x.date)&&!(x.noClass&&L.holiday&&!/방학/.test(x.title))).map(x=>({...x,kind:'acad'}));
  const ord={acad:0,annual:1,weekly:2};
  const off=L.holiday?offName(d):null;
  return ac.concat(S.school.filter(x=>d>=x.date&&d<=(x.end||x.date)&&deptVisible(x)&&!(off&&x.title.trim()===off)&&((x.kind==='annual'&&L.annual&&!(ded&&x.src==='gsheet'))||(x.kind==='weekly'&&L.weekly))))
    .sort((a,b)=>(ord[a.kind]-ord[b.kind])||(a.time||'99').localeCompare(b.time||'99'));
}
const isNoClassTitle=t=>t.length<=14&&/휴업|방학$|공휴일|대체휴일|대체공휴일|개교기념|휴교/.test(t.replace(/\s/g,''));
function isNoClassDay(d){if(HOLI[d])return true;if(ACADX.items().some(x=>x.noClass&&d>=x.date&&d<=(x.end||x.date)))return true;return S.school.some(x=>d>=x.date&&d<=(x.end||x.date)&&isNoClassTitle(x.title))}
function catOf(ev){return S.settings.cats.find(c=>c.id===ev.cat)||null}
function evtVisible(ev){
  if(S.privacy)return false;
  const c=catOf(ev);if(c&&!c.visible)return false;
  if(ev.hidden&&!S.settings.showHidden)return false;
  return true;
}
function occursOn(ev,d){
  if(ev.exdates&&ev.exdates.includes(d))return false;
  const r=(ev.repeat&&ev.repeat.freq)||'none';
  if(r==='none')return d>=ev.date&&d<=(ev.end||ev.date);
  if(d<ev.date)return false;if(ev.repeat.until&&d>ev.repeat.until)return false;
  const a=parseYmd(ev.date),b=parseYmd(d);const diff=Math.round((b-a)/864e5);
  if(r==='daily')return true;
  if(r==='weekdays'){const w=b.getDay();return w>0&&w<6}
  if(r==='weekly')return diff%7===0;
  if(r==='monthly')return a.getDate()===b.getDate();
  return false;
}
function eventsOn(d){
  return S.events.filter(ev=>evtVisible(ev)&&occursOn(ev,d)).sort((a,b)=>{
    if(!!a.allDay!==!!b.allDay)return a.allDay?-1:1;return (a.start||'').localeCompare(b.start||'')});
}
function evColor(ev){const c=catOf(ev);return c?c.color:'#6b7280'}

function chipSchool(x,lg){

}

/* ---------- now status ---------- */
function nowStatus(now){
  const d=ymd(now),w=now.getDay(),mins=now.getHours()*60+now.getMinutes();
  const P=periods();if(!P.length)return null;
  if((w===0||w===6)&&!S.settings.weekend)return{off:true,big:'주말이에요',meta:'편히 쉬세요.'};
  if(isNoClassDay(d))return{off:true,big:'오늘은 수업이 없는 날',meta:HOLI[d]||(ACADX.items().find(x=>x.noClass&&d>=x.date&&d<=(x.end||x.date))||{}).title||S.school.filter(x=>d>=x.date&&d<=(x.end||x.date)&&isNoClassTitle(x.title)).map(x=>x.title)[0]||''};
  const nextClass=from=>P.find(p=>toMin(p.start)>=from&&slotFor(d,p.n).text);
  for(const p of P){const s=toMin(p.start),e=toMin(p.end);
    if(mins>=s&&mins<e){const sl=slotFor(d,p.n);const nx=nextClass(e);
      return{cur:p.n,big:sl.text?`${pLabel(p)} · ${sl.text}`:`${pLabel(p)} · 공강`,meta:`${p.start}–${p.end}`+(nx?` · 다음 수업 ${pLabel(nx)} ${slotFor(d,nx.n).text} (${nx.start})`:' · 오늘 남은 수업 없음'),left:e-mins,leftLbl:'남음'}}}
  const first=toMin(P[0].start),last=toMin(P[P.length-1].end);
  const nx=nextClass(mins);
  if(mins<first){return{big:nx?`첫 수업 ${pLabel(nx)} · ${slotFor(d,nx.n).text}`:'오늘은 수업이 없어요',meta:nx?`${nx.start} 시작`:'',left:nx?toMin(nx.start)-mins:null,leftLbl:'후 시작'}}
  if(mins>=last)return{off:true,big:'오늘 수업 끝',meta:'수고하셨어요.'};
  const np=P.find(p=>toMin(p.start)>mins);const gap=np?toMin(np.start)-mins:0;
  const prevEnd=Math.max(...P.filter(p=>toMin(p.end)<=mins).map(p=>toMin(p.end)));
  const isLunch=np&&toMin(np.start)-prevEnd>=30;
  return{big:(isLunch?'점심시간':'쉬는 시간')+(nx?` · 다음 ${pLabel(nx)} ${slotFor(d,nx.n).text}`:''),meta:nx?`${nx.start} 시작`:'오늘 남은 수업 없음',left:nx?toMin(nx.start)-mins:gap,leftLbl:nx?'후 수업':'후'};
}

/* ---------- day ---------- */
function viewDay(){

  let out='<div class="day-wrap">';

    <form class="qa" data-qa="${d}"><input placeholder="빠른 추가: 예) 15:30 학년 협의회" aria-label="빠른 일정 추가"><button class="btn primary" type="submit">추가</button></form></div>`;

    out+=`<div class="card"><h3>이번 주 시간표 변경</h3><div class="list">`;
    for(const x of wk){for(const [n,c] of Object.entries(S.changes[x]).sort((a,b)=>a[0]-b[0])){
      out+=`<div class="small"><b>${mdw(x)} ${n}교시</b> · ${c.cancel?'<span class="muted">결강</span>':esc(c.text)}${baseText(x,n)&&!c.cancel?` <span class="muted">(원래 ${esc(baseText(x,n))})</span>`:''}</div>`}}
    out+='</div></div>';
  }
  out+='</div></div>';
  return out;
}

/* ---------- week ---------- */
function weekDays(ref){ref=ref||S.cursor;const w=ref.getDay();
  if(S.settings.weekend){const s=addDays(ref,-w);return [...Array(7)].map((_,i)=>addDays(s,i))}
  const mon=addDays(ref,w===0?1:1-w);return [...Array(5)].map((_,i)=>addDays(mon,i))}
function viewWeek(){
  const days=weekDays(),today=ymd(new Date()),now=new Date();const st=nowStatus(now);
  const cols=`64px repeat(${days.length},minmax(0,1fr))`;
  let o=`<div style="overflow:auto"><div class="wk" style="grid-template-columns:${cols}"><div class="rl"></div>`;
  for(const d of days){const ds=ymd(d);const h=offName(ds);
    o+=`<div class="hd${ds===today?' today':''}" data-goto="${ds}" style="cursor:pointer"><div class="w" style="${d.getDay()===0||h?'color:var(--holi)':d.getDay()===6?'color:var(--sat)':''}">${DOW[d.getDay()]}</div><div class="d">${d.getDate()}</div>${h&&S.settings.layers.holiday?`<div class="hn">${esc(h)}</div>`:''}</div>`}
  o+=`<div class="rl">학교<br>일정</div>`;
  for(const d of days){const ds=ymd(d);o+=`<div class="stack addz${ds===today?' col-today':''}" data-newschool-cell="${ds}">${schoolOn(ds).map(x=>chipSchool(x)).join('')}</div>`}
  if(S.settings.layers.timetable){
    for(const p of periods()){
      o+=`<div class="rl"><b>${esc(pLabel(p))}</b>${esc(p.start)}</div>`;
      for(const d of days){const ds=ymd(d);const sl=slotFor(ds,p.n);const nc=isNoClassDay(ds);
        const cur=ds===today&&st&&st.cur===p.n;
        o+=`<div class="cell${sl.changed?(sl.acad?' ac':' chg'):''}${cur?' cur':''}${ds===today?' col-today':''}" data-slot="${ds}|${p.n}" style="${nc?'opacity:.45':''}">${sl.text?esc(sl.text):`<span class="e">${sl.cancel?'결강':'·'}</span>`}${sl.changed&&sl.base&&sl.base!==sl.text?`<span class="was">${esc(sl.base)}</span>`:''}</div>`}
    }
  }
  o+=`<div class="rl">내<br>일정</div>`;
  for(const d of days){const ds=ymd(d);o+=`<div class="stack addz${ds===today?' col-today':''}" data-newevt-cell="${ds}" style="min-height:70px">${eventsOn(ds).map(ev=>chipEvt(ev,ds)).join('')}</div>`}
  o+='</div></div><p class="hint">시간표 칸을 누르면 그날만 바꿀 수 있고, 빈 곳을 누르면 일정을 추가해요.</p>';
  return o;
}

/* ---------- month ---------- */
function viewMonth(){
  const c=S.cursor,today=ymd(new Date());const first=new Date(c.getFullYear(),c.getMonth(),1);const start=addDays(first,-first.getDay());
  const last=new Date(c.getFullYear(),c.getMonth()+1,0);const rows=Math.ceil((first.getDay()+last.getDate())/7);
  let o='<div style="overflow:auto"><div class="mo">'+DOW.map((x,i)=>`<div class="dh${i===0?' sun':i===6?' sat':''}">${x}</div>`).join('');
  for(let i=0;i<rows*7;i++){const d=addDays(start,i),ds=ymd(d);const h=holidayOf(ds);
    const items=[...schoolOn(ds).map(x=>chipSchool(x)),...eventsOn(ds).map(ev=>chipEvt(ev,ds))];
    const maxN=4;const nChg=S.settings.layers.timetable?Object.keys(S.changes[ds]||{}).length:0;
    const cls=['dc',d.getMonth()!==c.getMonth()?'out':'',d.getDay()===0?'sun':d.getDay()===6?'sat':'',offName(ds)?'hol':'',ds===today?'today':''].join(' ');
    o+=`<div class="${cls}" data-newevt-cell="${ds}"><button class="num" data-goto="${ds}"><b>${d.getDate()}</b>${h?`<span class="hn">${esc(h)}</span>`:''}</button>
      ${nChg?`<span class="chgdot">시간표 변경 ${nChg}</span>`:''}${items.slice(0,maxN).join('')}${items.length>maxN?`<button class="more" data-goto="${ds}">+${items.length-maxN}개 더</button>`:''}</div>`}
  return o+'</div></div>';
}

/* ---------- year ---------- */
function viewYear(){
  const sy=syOf(S.cursor);let o='<div class="yr">';
  for(let i=0;i<12;i++){const m=(2+i)%12,y=m>=2?sy:sy+1;const ym=`${y}-${pad(m+1)}`;
    const rows=[];
    if(S.settings.layers.holiday)for(const [d,n] of Object.entries(HOLI))if(d.startsWith(ym))rows.push({d,t:n,h:true});
    if(S.settings.layers.acad!==false)for(const x of ACADX.items())if(x.title&&x.date.startsWith(ym)&&!(x.noClass&&HOLI[x.date]&&S.settings.layers.holiday))rows.push({d:x.date,e:x.end,t:x.title,a:x.noClass});
    if(S.settings.layers.annual)for(const x of S.school)if(x.kind==='annual'&&x.src!=='gsheet'&&deptVisible(x)&&(x.date.startsWith(ym)))rows.push({d:x.date,e:x.end,t:x.title});
    rows.sort((a,b)=>a.d.localeCompare(b.d));
    o+=`<div class="card" data-gomonth="${ym}-01"><h3>${m+1}월 <span class="sub">${y}</span></h3>${rows.length?rows.map(r=>`<div class="row${r.h||r.a?' h':''}"><span class="dd">${parseYmd(r.d).getDate()}${r.e&&r.e!==r.d?'~'+(r.e.slice(0,7)===r.d.slice(0,7)?parseYmd(r.e).getDate():md(r.e)):''}</span><span class="tx">${esc(r.t)}</span></div>`).join(''):'<div class="empty-note">일정 없음</div>'}</div>`}
  return o+'</div><p class="hint">학사일정과 공휴일을 보여 줘요. 빨간 줄은 수업이 없는 날이에요. 달을 누르면 월간 보기로 이동해요.</p>';
}

function mountSettings(){

  on('#s-name','change',e=>{s.myName=e.target.value.trim();saveSettings()});
  on('#s-wk','change',e=>{s.weekend=e.target.value==='1';saveSettings();render()});
}
function settingsChange(t){const s=S.settings;
    if(t.dataset.mysheet){const k=t.dataset.mysheet;const v=t.value.trim();const id=v?sheetIdFrom(v):'';if(v&&!id){toast('구글 시트 링크를 알아보지 못했어요');return}
      s.mySheets[k]=id||'';saveSettings();MYS.err[k]='';
      if(id)fetchMySheet(k,false);else{try{localStorage.removeItem('tcal.mysheet.'+k)}catch(e){}loadShared(true);toast('학교 기본 자료로 돌아갔어요')}return}
    if(t.id==='s-loc'){s.home.loc=t.value.trim()||'부산 강서구';saveSettings();return}
    if(t.id==='s-always'){lsSet('tcal.alwaysHome',t.checked);return}
    if(t.id==='s-autodd'){s.home.autoDday=t.checked;saveSettings();return}
    if(t.dataset.look==='preset'){LOOK.preset=t.value;if(t.value!=='img')LOOK.img='';applyLook();saveLook();render();return}
    if(t.id==='s-dedupe'){s.hideAnnualInWeekly=t.checked;saveSettings();return}
    if(t.dataset.gsid){const k=t.dataset.gsid;const v=t.value.trim();const id=v?sheetIdFrom(v):'';if(v&&!id){toast('구글 시트 링크를 알아보지 못했어요');return}
      s.gsync[k].id=id||'';if(!id){s.gsync[k].cover=[];s.gsync[k].count=0}saveSettings();lsSet('tcal.gs.last.'+k,0);if(id)syncAll(true);else render();return}
    if(t.dataset.look==='blur'){LOOK.blur=t.checked;applyLook();saveLook();return}
    if(t.dataset.look==='a'){LOOK.a=+t.value;applyLook();saveLook();return}
    if(t.dataset.look==='img'){const f=t.files[0];if(f)loadBgImage(f).then(()=>render()).catch(()=>toast('이미지를 열지 못했어요'));return}
    if(t.dataset.base){const[w,n]=t.dataset.base.split('|');S.base[w]=S.base[w]||{};const val=t.value.trim();if(val)S.base[w][n]={text:val};else delete S.base[w][n];saveSettings()}
    else if(t.dataset.pl!=null){periods()[+t.dataset.pl].label=t.value.trim();saveSettings()}
    else if(t.dataset.ps!=null){periods()[+t.dataset.ps].start=t.value;saveSettings()}
    else if(t.dataset.pe!=null){periods()[+t.dataset.pe].end=t.value;saveSettings()}
    else if(t.dataset.cc!=null){s.cats[+t.dataset.cc].color=t.value;saveSettings();renderSide()}
    else if(t.dataset.cn!=null){s.cats[+t.dataset.cn].name=t.value.trim()||'이름 없음';saveSettings();renderSide()}
}

/* ---------- modal helpers ---------- */
function openModal(html,cls){
  const b=document.createElement('div');b.className='mb';
  b.innerHTML=`<div class="md ${cls||''}" role="dialog" aria-modal="true"><button class="x" data-close aria-label="닫기">×</button>${html}</div>`;
  document.body.appendChild(b);
  b.addEventListener('mousedown',e=>{if(e.target===b)close()});
  b.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close()});
  function close(){b.remove();if(b._onclose)b._onclose()}
  b.close=close;
  setTimeout(()=>{const f=b.querySelector('[autofocus]');if(f)f.focus()},30);
  return b;
}
function confirmBox(msg,ok='확인',danger=true){return new Promise(res=>{
  const m=openModal(`<h2>확인</h2><p style="margin:0">${msg}</p><div class="actions"><button class="btn" data-close>취소</button><button class="btn ${danger?'danger':'primary'}" data-ok autofocus>${esc(ok)}</button></div>`);
  let done=false;m._onclose=()=>{if(!done)res(false)};
  $('[data-ok]',m).onclick=()=>{done=true;m.close();res(true)};
})}
function choiceBox(title,opts){return new Promise(res=>{
  const m=openModal(`<h2>${esc(title)}</h2><div class="stack">${opts.map((o,i)=>`<button class="btn ${o.cls||''}" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>`);
  let done=false;m._onclose=()=>{if(!done)res(null)};
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{done=true;m.close();res(opts[+b.dataset.i].value)});
})}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
document.addEventListener('keydown',e=>{
  const ms=$$('.mb');if(e.key==='Escape'&&ms.length){ms[ms.length-1].close();return}
  if(ms.length||/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;
  const k=e.key;
  if(k==='ArrowLeft')nav(-1);else if(k==='ArrowRight')nav(1);
  else if(k==='t'){S.cursor=new Date();render()}
  else if(k==='d')setView('day');else if(k==='w')setView('week');else if(k==='m')setView('month');else if(k==='y')setView('year');
  else if(k==='n')openEditor({type:'evt',date:ymd(S.cursor)});
});

/* ---------- editor (내 일정 / 학교 일정) ---------- */
function openEditor({type='evt',item=null,date,occ}){
  const isNew=!item;
  let it=item?clone(item):(type==='evt'?{title:(arguments[0].prefill&&arguments[0].prefill.title)||'',date,allDay:false,start:'',endTime:'',cat:S.settings.cats[0].id,note:'',hidden:false,repeat:{freq:'none',until:''}}:{title:'',date,kind:type,time:'',note:'',end:''});
  if(type==='evt'&&isNew){const now=new Date();let h=now.getHours()+1;if(h<8)h=9;if(h>21)h=9;it.start=pad(h)+':00';it.endTime=pad(Math.min(h+1,23))+':00'}
  let cur=type;
  const m=openModal(`<h2>${isNew?'새 일정':'일정 수정'}</h2><div class="stack">
    ${isNew?`<div class="seg" id="ed-type"><button data-t="evt">내 일정</button><button data-t="weekly">주간계획</button><button data-t="annual">학사일정</button></div>`:''}
    <input class="inp titlein" id="ed-title" placeholder="제목" value="${esc(it.title)}" autofocus>
    <div class="two"><label class="fld">날짜<input type="date" id="ed-date" value="${esc(it.date||'')}"></label><label class="fld">종료일 (여러 날일 때)<input type="date" id="ed-end" value="${esc(it.end||'')}"></label></div>
    <div id="ed-evt"></div><div id="ed-sch"></div>
    <label class="fld">메모<textarea id="ed-note" rows="2">${esc(it.note||'')}</textarea></label>
    ${item&&item.src==='gsheet'?`<p class="hint" style="margin:0">📄 구글 시트(${esc(item.dept||'')})에서 온 일정이에요. 여기서 고쳐도 시트가 바뀌면 다시 시트 내용으로 돌아가요.</p>`:''}
  </div><div class="actions">${!isNew?`<button class="btn danger left" id="ed-del">삭제</button>`:''}<button class="btn" data-close>취소</button><button class="btn primary" id="ed-save">저장</button></div>`);
  const drawType=()=>{
    $$('#ed-type button',m).forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
    const r=it.repeat||{freq:'none',until:''};
    $('#ed-evt',m).innerHTML=cur!=='evt'?'':`<div class="stack">
      <label class="toggle"><input type="checkbox" id="ed-allday" ${it.allDay?'checked':''}> 하루 종일</label>
      <div class="two" id="ed-times" style="${it.allDay?'display:none':''}"><label class="fld">시작<input type="time" id="ed-start" value="${esc(it.start||'')}"></label><label class="fld">끝<input type="time" id="ed-endt" value="${esc(it.endTime||'')}"></label></div>
      <div class="two"><label class="fld">카테고리<select id="ed-cat">${S.settings.cats.map(c=>`<option value="${esc(c.id)}" ${c.id===it.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label class="fld">반복<select id="ed-rep">${[['none','반복 안 함'],['daily','매일'],['weekdays','평일마다'],['weekly','매주'],['monthly','매월']].map(([v,n])=>`<option value="${v}" ${r.freq===v?'selected':''}>${n}</option>`).join('')}</select></label></div>
      <label class="fld" id="ed-untilw" style="${r.freq==='none'?'display:none':''}">반복 종료일 (비우면 계속)<input type="date" id="ed-until" value="${esc(r.until||'')}"></label>
      <label class="toggle"><input type="checkbox" id="ed-hidden" ${it.hidden?'checked':''}> 🙈 이 일정 숨기기 <span class="muted small">— 평소엔 안 보이고, "숨긴 일정도 보기"를 켜야 보여요</span></label></div>`;
    $('#ed-sch',m).innerHTML=cur==='weekly'?`<label class="fld">시간 (선택)<input type="time" id="ed-time" value="${esc(it.time||'')}"></label>`:'';
    if(cur==='evt'){
      $('#ed-allday',m).onchange=e=>{$('#ed-times',m).style.display=e.target.checked?'none':''};
      $('#ed-rep',m).onchange=e=>{$('#ed-untilw',m).style.display=e.target.value==='none'?'none':''};
    }
  };
  drawType();
  $$('#ed-type button',m).forEach(b=>b.onclick=()=>{collect();cur=b.dataset.t;drawType()});
  function collect(){
    it.title=$('#ed-title',m).value.trim();it.date=$('#ed-date',m).value;it.end=$('#ed-end',m).value;it.note=$('#ed-note',m).value.trim();
    if(cur==='evt'&&$('#ed-allday',m)){it.allDay=$('#ed-allday',m).checked;it.start=$('#ed-start',m).value;it.endTime=$('#ed-endt',m).value;it.cat=$('#ed-cat',m).value;
      it.repeat={freq:$('#ed-rep',m).value,until:$('#ed-until',m).value};it.hidden=$('#ed-hidden',m).checked}
    if(cur==='weekly'&&$('#ed-time',m))it.time=$('#ed-time',m).value;
  }
  $('#ed-save',m).onclick=()=>{
    collect();
    if(!it.title){$('#ed-title',m).focus();toast('제목을 입력해 주세요');return}
    if(!it.date){toast('날짜를 골라 주세요');return}
    if(it.end&&it.end<=it.date)it.end='';
    if(cur==='evt'){
      const ev={id:it.id||newId(),title:it.title,date:it.date,end:it.end||'',allDay:!!it.allDay,start:it.allDay?'':it.start,endTime:it.allDay?'':it.endTime,cat:it.cat,note:it.note,hidden:!!it.hidden,repeat:it.repeat&&it.repeat.freq!=='none'?it.repeat:{freq:'none'},exdates:it.exdates||[]};
      if(isNew)S.events.push(ev);else{const i=S.events.findIndex(x=>x.id===item.id);S.events[i]=ev}
      markMonths('evt_',[ev.date,item&&item.date]);
      toast(ev.hidden?'숨긴 일정으로 저장했어요':'저장했어요');
    }else{
      const x={id:it.id||newId(),kind:cur,title:it.title,date:it.date,end:it.end||'',time:cur==='weekly'?(it.time||''):'',note:it.note,src:it.src||'manual'};
      if(isNew)S.school.push(x);else{const i=S.school.findIndex(y=>y.id===item.id);S.school[i]=x}
      markMonths('sch_',[x.date,item&&item.date]);toast('저장했어요');
    }
    m.close();render();
  };
  if(!isNew)$('#ed-del',m).onclick=async()=>{
    if(type==='evt'){
      const rep=item.repeat&&item.repeat.freq&&item.repeat.freq!=='none';
      if(rep&&occ){const c=await choiceBox('반복 일정 삭제',[{label:`이 날(${mdw(occ)})만 삭제`,value:'one'},{label:'모든 반복 삭제',value:'all',cls:'danger'}]);if(!c)return;
        if(c==='one'){const ev=S.events.find(x=>x.id===item.id);ev.exdates=[...(ev.exdates||[]),occ];markMonths('evt_',[ev.date]);m.close();render();return}}
      else if(!await confirmBox('이 일정을 삭제할까요?','삭제'))return;
      S.events=S.events.filter(x=>x.id!==item.id);markMonths('evt_',[item.date]);
    }else{
      if(!await confirmBox('이 학교 일정을 삭제할까요?','삭제'))return;
      S.school=S.school.filter(x=>x.id!==item.id);markMonths('sch_',[item.date]);
    }
    m.close();render();toast('삭제했어요');
  };
  $('#ed-title',m).addEventListener('keydown',e=>{if(e.key==='Enter')$('#ed-save',m).click()});
}

    <p class="hint" style="margin:0">매주 바뀌는 수업이면 <button class="linkbtn" data-goset>설정 › 기본 시간표</button>에서 고치세요.</p></div>
    <div class="actions"><button class="btn" data-close>취소</button><button class="btn primary" id="sl-save">이 날만 변경</button></div>`);
  const put=v=>{S.changes[d]=S.changes[d]||{};if(v===null)delete S.changes[d][n];else S.changes[d][n]=v;if(!Object.keys(S.changes[d]).length)delete S.changes[d];markMonths('chg_',[d]);m.close();render()};
  $('#sl-save',m).onclick=()=>{const t=$('#sl-t',m).value.trim();if(t===sl.base&&!sl.cancel){put(null);return}put(t?{text:t,src:'manual'}:{cancel:true,text:'',src:'manual'});toast('이 날 시간표를 바꿨어요')};
  $('#sl-cancel',m).onclick=()=>{put({cancel:true,text:'',src:'manual'});toast('결강으로 표시했어요')};
  if(sl.changed)$('#sl-reset',m).onclick=()=>{put(null);toast('기본 시간표로 되돌렸어요')};
  $('[data-goset]',m).onclick=()=>{m.close();setView('settings')};
  $('#sl-t',m).addEventListener('keydown',e=>{if(e.key==='Enter')$('#sl-save',m).click()});
}

/* ---------- import parsing ---------- */
function inferYear(mo){const sy=S.settings.schoolYear;return mo>=3?sy:sy+1}
function mk(y,mo,d){if(mo<1||mo>12||d<1||d>31)return null;const x=new Date(y,mo-1,d);if(x.getMonth()!==mo-1)return null;return ymd(x)}
function serialToYmd(n){const d=new Date(Math.round((n-25569)*864e5));return mk(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
function parseOne(s,ctx){
  s=String(s).replace(/\([^)]*\)/g,'').replace(/[()]/g,'').replace(/\s+/g,' ').trim();let m;
  if(m=s.match(/^(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/))return mk(+m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{2})\s*[./]\s*(\d{1,2})\s*[./]\s*(\d{1,2})/))return mk(2000+ +m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{1,2})\s*[-./월]\s*(\d{1,2})/))return mk(inferYear(+m[1]),+m[1],+m[2]);
  if(ctx&&(m=s.match(/^(\d{1,2})\s*일?$/)))return mk(ctx.y,ctx.m,+m[1]);
  return null;
}
function parseDateCell(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){if(v>20000&&v<80000){const a=serialToYmd(Math.floor(v));return a?[a,null]:null}return null}
  const s=String(v).trim();if(!s)return null;
  const ctxOf=a=>{const d=parseYmd(a);return{y:d.getFullYear(),m:d.getMonth()+1}};
  let sp=s.split(/\s*[~～〜]\s*/);
  if(sp.length===2){const a=parseOne(sp[0]);if(a){const b=parseOne(sp[1],ctxOf(a));return[a,b&&b>a?b:null]}}
  let m=s.match(/^(\d{1,2}\s*[./월]\s*\d{1,2}\s*일?\s*(?:\([^)]*\))?)\s*[-–]\s*(\d.*)$/);
  if(m){const a=parseOne(m[1]);if(a){const b=parseOne(m[2],ctxOf(a));return[a,b&&b>a?b:null]}}
  const a=parseOne(s);return a?[a,null]:null;
}
function parseTime(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'){if(v>0&&v<1){const t=Math.round(v*1440);return pad(Math.floor(t/60))+':'+pad(t%60)}return ''}
  const s=String(v);let m=s.match(/(\d{1,2})\s*교시/);
  if(m){const p=periods().find(x=>x.n===+m[1]);return p?p.start:''}
  const pm=/오후|PM|pm/.test(s);m=s.match(/(\d{1,2})\s*[:시]\s*(\d{1,2})?/);if(!m)return '';
  let h=+m[1],mi=+(m[2]||0);if(pm&&h<12)h+=12;if(h>23||mi>59)return '';return pad(h)+':'+pad(mi);
}
function parsePeriods(v){
  if(v==null||v==='')return[];const s=String(v);let m=s.match(/(\d{1,2})\s*[-~～]\s*(\d{1,2})/);
  if(m){const a=+m[1],b=+m[2];const o=[];for(let i=a;i<=b&&i<=15;i++)o.push(i);return o}
  return (s.match(/\d{1,2}/g)||[]).map(Number).filter(n=>n>=1&&n<=15);
}
function parseDelimited(text){
  const delim=text.includes('\t')?'\t':',';const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===delim){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

  const drawKind=()=>{$$('#im-kind button',m).forEach(b=>b.classList.toggle('on',b.dataset.k===st.kind));$('#im-hint',m).textContent=HINTS[st.kind];if(st.rows){guess();drawBody()}};
  $$('#im-kind button',m).forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;st.touchedKind=true;if(st.deptSheets){$('#im-hint',m).textContent=HINTS[st.kind];if(st.kind==='change'){toast('이 양식은 시간표 변경 표가 아니에요');}drawDept();return}drawKind()});

  $('#im-file',m).onchange=async e=>{

  $('#im-paste',m).addEventListener('input',e=>{const t=e.target.value;if(t.trim()){st.wb=null;if(/##\s*Sheet name/.test(t)&&tryDept(splitSheets(t),'붙여넣은 시트'))return;setRows(parseDelimited(t),'붙여넣은 표')}});
  function drawAcad(r,name){

      <div class="prev"><table><tr><th>날짜</th><th>순번</th><th>내용</th><th>시간표</th></tr>${its.map(x=>`<tr><td>${mdw(x.date)}${x.end?' ~ '+mdw(x.end):''}</td><td>${esc(x.counter)}</td><td${x.noClass?' style="color:var(--holi)"':''}>${esc(x.title)}</td><td class="muted">${x.rule?(x.rule.dow!=null?'요일 교체':x.rule.cut?'단축·교체':x.rule.map?'수업 순서 조정':'행사 교시'):''}</td></tr>`).join('')}</table></div>`;

  function tryDept(sheets,label){

  function drawDept(){

    const P=parseDeptSheets(st.deptSheets,{schoolYear:S.settings.schoolYear,kind:st.kind,periods:periods()});st.deptParsed=P;

      <p class="hint">위에서 <b>주간계획</b>인지 <b>학사일정·연간계획</b>인지 골라 주세요. 같은 종류로 전에 가져온 시트 일정은 이 내용으로 바뀌어요(구글 시트 연동과 같은 방식).</p>
      <div class="prev"><table><tr><th>날짜</th><th>시간</th><th>부서</th><th>내용</th></tr>${P.items.slice(0,14).map(x=>`<tr><td>${mdw(x.date)}</td><td>${esc(x.time)}</td><td>${esc(x.dept)}</td><td>${esc(x.title)}</td></tr>`).join('')}</table></div>`;

  function loadSheet(name){const ws=st.wb.Sheets[st.wb.SheetNames[st.sheet]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
    setRows(rows,name+' · '+st.wb.SheetNames[st.sheet])}
  function setRows(rows,label){
    st.rows=rows.map(r=>r.map(c=>typeof c==='string'?c.trim():c));
    // header: first row (in first 10) that matches 2+ field regexes
    st.header=0;let best=-1;
    for(let i=0;i<Math.min(10,st.rows.length);i++){let sc=0;for(const k of Object.keys(FIELDS))for(const f of FIELDS[k])if(st.rows[i].some(c=>typeof c==='string'&&f[2].test(c)))sc++;if(sc>best){best=sc;st.header=i}}
    $('#im-src',m).textContent=label?`불러옴: ${label} (${st.rows.length}줄)`:'';
    guess();drawBody();
  }
  function guess(){
    const hdr=(st.rows[st.header]||[]).map(c=>String(c));st.map={};const used=new Set();
    const order=st.kind==='change'?['date','period','orig','teacher','cls','subj','type']:FIELDS[st.kind].map(f=>f[0]);
    for(const key of order){const f=FIELDS[st.kind].find(x=>x[0]===key);
      const i=hdr.findIndex((h,j)=>!used.has(j)&&f[2].test(h)&&!(f[3]&&f[3].test(h)));if(i>=0){st.map[key]=i;used.add(i)}}
    if(st.map.date==null){// guess by content
      const i=hdr.findIndex((_,j)=>!used.has(j)&&st.rows.slice(st.header+1,st.header+6).some(r=>parseDateCell(r[j])));if(i>=0)st.map.date=i}
  }
  function colName(i){const h=String((st.rows[st.header]||[])[i]??'').slice(0,14);return `${String.fromCharCode(65+(i%26))}열${h?': '+h:''}`}
  function drawBody(){
    const nCols=Math.max(...st.rows.slice(0,50).map(r=>r.length),0);
    const sheetSel=st.wb&&st.wb.SheetNames.length>1?`<label class="fld">시트<select id="im-sheet">${st.wb.SheetNames.map((n,i)=>`<option value="${i}" ${i===st.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`:'';
    const hdrSel=`<label class="fld">제목 줄<select id="im-hdr">${st.rows.slice(0,10).map((r,i)=>`<option value="${i}" ${i===st.header?'selected':''}>${i+1}번째 줄: ${esc(r.filter(Boolean).slice(0,3).join(' · ').slice(0,26))}</option>`).join('')}</select></label>`;
    const maps=FIELDS[st.kind].map(([k,label])=>`<label class="fld">${esc(label)}<select data-map="${k}"><option value="">(없음)</option>${[...Array(nCols)].map((_,i)=>`<option value="${i}" ${st.map[k]===i?'selected':''}>${esc(colName(i))}</option>`).join('')}</select></label>`).join('');
    const nameF=st.kind==='change'?`<label class="fld">내 이름 (교사 열에서 찾을 이름)<input id="im-name" value="${esc(st.myName)}" placeholder="예) 김민지"></label>`:'';
    const preview=`<div class="prev"><table>${st.rows.slice(0,8).map((r,i)=>`<tr class="${i===st.header?'hdr':''}">${[...Array(nCols)].map((_,j)=>`<td>${esc(fmtCell(r[j]))}</td>`).join('')}</tr>`).join('')}</table></div>`;
    $('#im-body',m).innerHTML=`<div class="maps">${sheetSel}${hdrSel}${maps}${nameF}</div>
      <div class="opts">${st.kind!=='change'?`<label class="toggle"><input type="checkbox" id="im-fill" ${st.fill?'checked':''}> 날짜 칸이 비면 위 줄 날짜로 채우기</label>`:`<label class="toggle"><input type="checkbox" id="im-fill" ${st.fill?'checked':''}> 날짜 칸이 비면 위 줄 날짜로 채우기</label>`}
      <label class="toggle"><input type="checkbox" id="im-rep" ${st.replace?'checked':''}> 같은 기간에 전에 가져온 항목은 새 것으로 바꾸기</label></div>
      <div class="small muted" style="margin-bottom:4px">원본 미리보기</div>${preview}<div id="im-res"></div>`;
    const b=$('#im-body',m);
    if($('#im-sheet',b))$('#im-sheet',b).onchange=e=>{st.sheet=+e.target.value;loadSheet(st.fname||'')};
    $('#im-hdr',b).onchange=e=>{st.header=+e.target.value;guess();drawBody()};
    $$('[data-map]',b).forEach(s=>s.onchange=()=>{const v=s.value;if(v==='')delete st.map[s.dataset.map];else st.map[s.dataset.map]=+v;drawResult()});
    $('#im-fill',b).onchange=e=>{st.fill=e.target.checked;drawResult()};
    $('#im-rep',b).onchange=e=>{st.replace=e.target.checked};

    drawResult();
  }
  function fmtCell(v){if(typeof v==='number'&&v>20000&&v<80000){const a=serialToYmd(Math.floor(v));return a||v}if(typeof v==='number'&&v>0&&v<1)return parseTime(v);return v??''}
  function parseAll(){
    const M=st.map,get=(r,k)=>M[k]==null?'':r[M[k]];const out=[];let skipped=0,lastDate=null,notMine=0;
    for(const r of st.rows.slice(st.header+1)){
      let dr=parseDateCell(get(r,'date'));

      if(dr)lastDate=dr;
      if(st.kind==='annual'||st.kind==='weekly'){
        const title=String(get(r,'title')??'').trim();if(!title){continue}
        if(!dr){skipped++;continue}
        let end=dr[1]||'';if(M.end!=null){const e=parseDateCell(get(r,'end'));if(e&&e[0]>dr[0])end=e[0]}
        out.push({kind:st.kind,date:dr[0],end,title:title.replace(/\s*\n\s*/g,' '),time:st.kind==='weekly'?parseTime(get(r,'time')):'',note:String(get(r,'note')??'').trim().replace(/\s*\n\s*/g,' ')});
      }else{
        const ps=parsePeriods(get(r,'period'));if(!dr||!ps.length){if(String(get(r,'period')).trim()||String(get(r,'date')).trim())skipped++;continue}
        const me=st.myName;const tcell=String(get(r,'teacher')??''),ocell=String(get(r,'orig')??'');const type=String(get(r,'type')??'');
        let mine=true,cancel=false;

          const inT=M.teacher!=null&&tcell.includes(me),inO=M.orig!=null&&ocell.includes(me);

        if(!mine){notMine++;continue}
        if(/결강|취소|삭제/.test(type))cancel=true;
        const text=[get(r,'cls'),get(r,'subj')].map(x=>String(x??'').trim()).filter(Boolean).join(' ')||(cancel?'':(type||'변경'));

  }
  function drawResult(){
    const res=$('#im-res',m);const ok=REQ[st.kind].every(k=>st.map[k]!=null);
    if(!ok){res.innerHTML=`<p class="okline" style="color:var(--holi)">* 표시된 열을 골라 주세요.</p>`;$('#im-go',m).disabled=true;return}
    const P=parseAll();st.parsed=P;

      :`<tr><td>${mdw(x.date)}${x.end?' ~ '+mdw(x.end):''}</td><td>${esc(x.time||'')}</td><td>${esc(x.title)}</td><td class="muted">${esc(x.note)}</td></tr>`).join('');
    const warn=st.kind==='change'&&!st.myName&&(st.map.teacher!=null||st.map.orig!=null)?'<div class="small" style="color:var(--chg)">내 이름을 적으면 내 수업만 골라 가져와요. 지금은 모든 줄을 내 시간표로 가져와요.</div>':'';
    res.innerHTML=`<p class="okline">✓ ${P.items.length}건을 알아봤어요${P.skipped?` · 날짜를 못 읽은 ${P.skipped}줄 건너뜀`:''}${P.notMine?` · 다른 선생님 수업 ${P.notMine}줄 제외`:''}</p>${warn}
      ${P.items.length?`<div class="prev"><table><tr><th>날짜</th><th>${st.kind==='change'?'교시':'시간'}</th><th>${st.kind==='change'?'바뀐 수업':'내용'}</th><th>${st.kind==='change'?'':'비고'}</th></tr>${lines}${P.items.length>12?`<tr><td colspan="4" class="muted">… 외 ${P.items.length-12}건</td></tr>`:''}</table></div>`:''}`;
    $('#im-go',m).disabled=!P.items.length;
  }
  $('#im-go',m).onclick=()=>{
    if(st.acadParsed){const r=st.acadParsed;S.acadDoc={source:r.name.replace(/\.hwpx$/i,''),saved:Date.now(),items:r.items};markDirty('acad');m.close();render();toast(`학사일정 ${r.items.length}건을 반영했어요`);return}
    if(st.deptSheets&&st.deptParsed){const r=applyDept(st.kind,st.deptParsed);m.close();render();toast(`${r.total}건을 반영했어요 (새로 ${r.added} · 빠짐 ${r.removed})`);return}
    const P=st.parsed;if(!P||!P.items.length)return;
    if(st.kind==='change'){
      if(st.myName&&st.myName!==S.settings.myName){S.settings.myName=st.myName;saveSettings()}
      const dates=[...new Set(P.items.map(x=>x.date))];
      if(st.replace)for(const d of dates){const o=S.changes[d];if(o)for(const n of Object.keys(o))if(o[n].src==='import')delete o[n]}
      for(const x of P.items){S.changes[x.date]=S.changes[x.date]||{};S.changes[x.date][x.period]=x.cancel?{cancel:true,text:'',src:'import'}:{text:x.text,src:'import'}}
      for(const d of dates)if(S.changes[d]&&!Object.keys(S.changes[d]).length)delete S.changes[d];
      markMonths('chg_',dates);
    }else{
      const ds=P.items.map(x=>x.date).sort();const lo=ds[0],hi=ds[ds.length-1];

      for(const x of P.items)S.school.push({id:newId(),...x,src:'import'});
      markMonths('sch_',[...ds,...removed]);
    }
    m.close();
    if(st.kind==='change'){S.cursor=parseYmd(P.items[0].date);if(S.view!=='day'&&S.view!=='week')S.view='week'}
    render();toast(`${P.items.length}건을 가져왔어요`);
  };
}

function loadJSZip(){if(window.JSZip)return Promise.resolve(window.JSZip);return new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';sc.onload=()=>ok(window.JSZip);sc.onerror=()=>no(new Error('압축 도구를 불러오지 못했어요'));document.head.appendChild(sc)})}
async function readHwpx(file){const Z=await loadJSZip();const z=await Z.loadAsync(await file.arrayBuffer());
  const names=Object.keys(z.files).filter(n=>/^Contents\/section\d+\.xml$/i.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  return Promise.all(names.map(n=>z.file(n).async('string')))}
/* ---------- base paste ---------- */
function openPasteBase(){
  const m=openModal(`<h2>기본 시간표 붙여넣기</h2><p class="hint">시트에서 <b>월~금 × 교시</b> 범위를 복사해 붙여넣으세요. 요일 제목 줄과 교시 열이 함께 있어도 괜찮아요.</p>
    <textarea class="inp" id="pb" rows="8" style="width:100%" placeholder="월\t화\t수\t목\t금&#10;2-3 국어\t\t1-2 국어\t…" autofocus></textarea>
    <div class="actions"><button class="btn" data-close>취소</button><button class="btn primary" id="pb-ok">채우기</button></div>`,'wide');
  $('#pb-ok',m).onclick=()=>{
    let rows=parseDelimited($('#pb',m).value);if(!rows.length){toast('붙여넣은 내용이 없어요');return}
    if(rows[0].some(c=>/^[월화수목금토]/.test(String(c).trim())))rows=rows.slice(1);
    const firstColLbl=rows.every(r=>/^\s*\d{0,2}\s*(교시)?\s*$/.test(String(r[0]))&&String(r[0]).trim()!=='')||rows.every(r=>/교시/.test(String(r[0])));
    if(firstColLbl)rows=rows.map(r=>r.slice(1));
    const P=periods();while(P.length<rows.length&&P.length<12){const l=P[P.length-1];P.push({n:l.n+1,start:l.end,end:l.end})}
    rows.forEach((r,i)=>{const p=P[i];if(!p)return;for(let w=1;w<=6;w++){const v=String(r[w-1]??'').trim();S.base[w]=S.base[w]||{};if(v)S.base[w][p.n]={text:v};else if(w<=5||S.settings.weekend)delete S.base[w][p.n]}});
    saveSettings();m.close();render();toast('기본 시간표를 채웠어요');
  };
}

/* ---------- backup ---------- */
function exportData(){return JSON.stringify({app:'school-calendar',v:2,savedAt:new Date().toISOString(),settings:S.settings,base:S.base,changes:S.changes,school:S.school.filter(x=>x.src!=='gsheet'),events:S.events,tray:S.tray,acadDoc:S.acadDoc},null,1)}
function allKeys(){const k=new Set(['settings','tray','acad']);Object.keys(S.changes).forEach(d=>k.add('chg_'+d.slice(0,7)));S.school.forEach(x=>k.add('sch_'+x.date.slice(0,7)));S.events.forEach(x=>k.add('evt_'+x.date.slice(0,7)));return k}
function doBackup(){
  const blob=new Blob([exportData()],{type:'application/json'});const a=document.createElement('a');const d=new Date();
  a.href=URL.createObjectURL(blob);a.download=`school-calendar-backup-${ymd(d)}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast('백업 파일을 내려받았어요. 자료함의 파일 자체는 백업에 들어가지 않아요.');

function textFromResult(res){
  const out=[];const walk=v=>{if(typeof v==='string')out.push(v);else if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object')Object.values(v).forEach(walk)};
  walk(res&&res.payload);(res&&res.content||[]).forEach(c=>{if(c&&c.type==='text')out.push(c.text)});
  const hit=out.filter(t=>/Sheet name/.test(t)).sort((a,b)=>b.length-a.length)[0];
  return hit||out.sort((a,b)=>b.length-a.length)[0]||'';
}
function base64FromResult(res){
  const cands=[];const walk=v=>{if(typeof v==='string'){const t=v.trim();if(t.startsWith('{')){try{walk(JSON.parse(t));return}catch(_){}}cands.push(t)}else if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(typeof v.content==='string')cands.unshift(v.content.trim());Object.values(v).forEach(walk)}};
  walk(res&&res.payload);(res&&res.content||[]).forEach(c=>{if(c&&c.type==='text')walk(c.text)});
  return cands.find(t=>/^UEsD[A-Za-z0-9+/=\s]+$/.test(t.slice(0,200)))||null;
}

function applyDept(kind,parsed){
  const old=S.school.filter(x=>x.kind===kind&&x.src==='gsheet');
  const key=arr=>arr.map(x=>x.id).sort().join(',');
  let added=0,removed=0;
  if(key(old)!==key(parsed.items)){
    const oi=new Set(old.map(x=>x.id)),ni=new Set(parsed.items.map(x=>x.id));
    added=parsed.items.filter(x=>!oi.has(x.id)).length;removed=old.filter(x=>!ni.has(x.id)).length;
    S.school=S.school.filter(x=>!(x.kind===kind&&x.src==='gsheet')).concat(parsed.items);
    const months=new Set([...old,...parsed.items].map(x=>x.date.slice(0,7)));
    for(const ym of months)if(key(old.filter(x=>x.date.startsWith(ym)))!==key(parsed.items.filter(x=>x.date.startsWith(ym))))markDirty('sch_'+ym);
  }
  const g=S.settings.gsync[kind];
  if(JSON.stringify(g.cover||[])!==JSON.stringify(parsed.cover)||g.count!==parsed.items.length){g.cover=parsed.cover;g.count=parsed.items.length;saveSettings()}
  lsSet('tcal.gs.last.'+kind,Date.now());
  return{added,removed,total:parsed.items.length};
}
async function syncOne(kind){
  const g=S.settings.gsync[kind];if(!g.id)throw{code:'no_id'};
  const mcp=await mcpNS();if(!mcp)throw{code:'no_mcp'};
  if(typeof XLSX==='undefined')throw{code:'no_xlsx'};
  const call=()=>mcp.callTool('Google Drive','download_file_content',{fileId:g.id,exportMimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},{cache:false});
  let res;try{res=await call()}catch(e){if(e&&e.retryable){await sleep(Math.max(e.retryAfterMs||0,800+Math.random()*1500));res=await call()}else throw e}
  const b64=base64FromResult(res);if(!b64)throw{code:'format'};
  let wb;try{wb=XLSX.read(b64,{type:'base64'})}catch(e){throw{code:'format'}}
  const sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''})}));
  const parsed=parseDeptSheets(sheets,{schoolYear:S.settings.schoolYear,kind,periods:periods()});
  if(!parsed.items.length)throw{code:'format'};
  return applyDept(kind,parsed);
}

async function loadBgImage(file){
  const url=URL.createObjectURL(file);const img=new Image();

  const k=Math.min(1,1920/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);

function ddays(){
  const t=ymd(new Date());const out=[];
  for(const d of S.settings.home.ddays||[])if(d.date>=t)out.push({...d,mine:true});

      if(seen.has(key))continue;seen.add(key);out.push({id:x.id,title:x.title.replace(/\s*·\s*\(.*$/,''),date:x.date})}}

  async get(k){const db=await this.open();return new Promise((ok,no)=>{const r=db.transaction('files').objectStore('files').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async del(k){const db=await this.open();return new Promise(ok=>{const t=db.transaction('files','readwrite');t.objectStore('files').delete(k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}};

  const files=Array.from(dt.files||[]);const entries=Array.from(dt.items||[]).filter(i=>i.kind==='file').map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null);
  if(!files.length){const u=(dt.getData('text/uri-list')||dt.getData('text/plain')||'').split(/\r?\n/).find(l=>/^https?:\/\//.test(l.trim()));
    if(u){let name=u.trim();try{const U=new URL(name);name=U.hostname.replace(/^www\./,'')+(U.pathname.length>1?U.pathname.slice(0,30):'')}catch(_){}addItem({box:boxId,kind:'link',name,url:u.trim()});toast('링크를 넣었어요')}return}
  let up=0,nm=0,fo=0;
  for(let i=0;i<files.length;i++){const en=entries[i];
    if(en&&en.isDirectory){const it=addItem({box:boxId,kind:'folder',name:en.name,busy:true});it.count=await countDir(en);delete it.busy;saveTray();render();fo++}
    else{const k=await addFile(files[i],boxId);if(k==='file')up++;else nm++}}
  toast([up?`파일 ${up}개를 이 브라우저에 보관`:'',fo?`폴더 ${fo}개 기록`:'',nm?`${nm}개는 너무 커서 이름만 기록`:''].filter(Boolean).join(' · '));
}
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-ti]');if(t){e.dataTransfer.setData('text/x-tray',t.dataset.ti);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const b=e.target.closest&&e.target.closest('[data-box]');const types=Array.from(e.dataTransfer.types||[]);
  if(b||types.includes('Files')){e.preventDefault();e.dataTransfer.dropEffect=b?(types.includes('text/x-tray')?'move':'copy'):'none'}
  $$('.tbox.over').forEach(x=>{if(x!==b)x.classList.remove('over')});if(b)b.classList.add('over')});
document.addEventListener('dragleave',e=>{const b=e.target.closest&&e.target.closest('[data-box]');if(b&&!b.contains(e.relatedTarget))b.classList.remove('over')});
document.addEventListener('drop',e=>{$$('.tbox.over').forEach(x=>x.classList.remove('over'));const b=e.target.closest&&e.target.closest('[data-box]');
  if(b){e.preventDefault();trayDrop(e,b.dataset.box);return}
  if(Array.from(e.dataTransfer.types||[]).includes('Files')){e.preventDefault();toast(S.view==='home'?'자료함의 상자 위에 놓아 주세요':'홈 화면의 자료함 상자 위에 놓아 주세요')}});
function openBoxEditor(b){
  const isNew=!b;b=b||{id:newId(),name:'',color:'#7c3aed'};
  const m=openModal(`<h2>${isNew?'새 상자':'상자 고치기'}</h2><div class="catrow"><input type="color" id="bx-c" value="${esc(b.color)}"><input class="inp" id="bx-n" value="${esc(b.name)}" placeholder="상자 이름 (예: 3학년 자료)" style="flex:1" autofocus></div>
    <div class="actions"><button class="btn" data-close>취소</button><button class="btn primary" id="bx-ok">저장</button></div>`);
  $('#bx-ok',m).onclick=()=>{const n=$('#bx-n',m).value.trim();if(!n){toast('이름을 넣어 주세요');return}b.name=n;b.color=$('#bx-c',m).value;if(isNew)tray().boxes.push(b);saveTray();m.close();render()};
  $('#bx-n',m).addEventListener('keydown',e=>{if(e.key==='Enter')$('#bx-ok',m).click()});
}
function openItemEditor(it){
  const m=openModal(`<h2>${iconOf(it)} ${esc(it.name)}</h2><div class="stack">
    <div class="small muted">${it.local?`${fmtSize(it.size)} — 이 브라우저에 보관된 파일이에요. 다른 컴퓨터에서는 보이지 않아요.`:it.kind==='folder'?`폴더${it.count!=null?' · 파일 '+it.count+'개':''} — 웹 페이지는 내 컴퓨터의 폴더를 직접 열거나 옮길 수 없어서 이름만 기록했어요.`:it.kind==='name'?`${fmtSize(it.size)} — 이 형식은 올릴 수 없어 이름만 기록했어요. 구글 드라이브 등에 올린 뒤 링크를 붙여 두면 여기서 바로 열 수 있어요.`:''}</div>
    <label class="fld">이름<input class="inp" id="it-n" value="${esc(it.name)}"></label>
    ${it.kind!=='file'?`<label class="fld">링크 (선택)<input class="inp" id="it-u" value="${esc(it.url||'')}" placeholder="https://drive.google.com/..."></label>`:''}
    <label class="fld">메모<textarea class="inp" id="it-m" rows="2">${esc(it.memo||'')}</textarea></label>
    <label class="fld">상자<select class="inp" id="it-b">${tray().boxes.map(b=>`<option value="${esc(b.id)}" ${b.id===it.box?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label></div>
    <div class="actions">${it.local?`<button class="btn left" data-lfopen>열기</button><button class="btn" data-lfdown>내려받기</button>`:''}${it.url?`<a class="btn left" href="${esc(it.kind==='file'?it.url:safeUrl(it.url))}" target="_blank" rel="noopener">열기</a>`:''}<button class="btn" data-close>취소</button><button class="btn primary" id="it-ok">저장</button></div>`);
  if(it.local){$('[data-lfopen]',m).onclick=()=>openLocalFile(it.id);$('[data-lfdown]',m).onclick=()=>openLocalFile(it.id,true)}
  $('#it-ok',m).onclick=()=>{it.name=$('#it-n',m).value.trim()||it.name;if($('#it-u',m))it.url=$('#it-u',m).value.trim();it.memo=$('#it-m',m).value.trim();it.box=$('#it-b',m).value;saveTray();m.close();render()};
}
async function removeItem(id){const T=tray();const it=T.items.find(x=>x.id===id);if(!it)return;
  if(!await confirmBox(`"${esc(it.name)}"을(를) 자료함에서 뺄까요?${it.local?' 이 브라우저에 보관한 파일도 지워져요.':''}`,'빼기'))return;
  if(it.local)await IDB.del(it.id);
  T.items=T.items.filter(x=>x!==it);saveTray();render()}
document.addEventListener('click',async e=>{
  if(e.target.closest('.mb'))return;const t=e.target;
  const d=t.closest('[data-tidel]');if(d){e.preventDefault();e.stopPropagation();removeItem(d.dataset.tidel);return}
  const lf=t.closest('[data-tifile]');if(lf){openLocalFile(lf.dataset.tifile);return}
  const o=t.closest('[data-tiopen]');if(o){const it=tray().items.find(x=>x.id===o.dataset.tiopen);if(it&&!it.busy)openItemEditor(it);return}
  const be=t.closest('[data-boxedit]');if(be){openBoxEditor(tray().boxes.find(x=>x.id===be.dataset.boxedit));return}
  const bd=t.closest('[data-boxdel]');if(bd){const T=tray();if(T.boxes.length<=1){toast('상자는 하나 이상 있어야 해요');return}
    const b=T.boxes.find(x=>x.id===bd.dataset.boxdel);const its=T.items.filter(x=>x.box===b.id);const to=T.boxes.find(x=>x!==b);
    if(!await confirmBox(`"${esc(b.name)}" 상자를 지울까요?${its.length?` 안에 있는 ${its.length}개는 "${esc(to.name)}" 상자로 옮겨져요.`:''}`,'지우기'))return;
    its.forEach(x=>x.box=to.id);T.boxes=T.boxes.filter(x=>x!==b);saveTray();render();return}
  const dl=t.closest('[data-ddel]');if(dl){S.settings.home.ddays=S.settings.home.ddays.filter(x=>x.id!==dl.dataset.ddel);saveSettings();render();return}
});
document.addEventListener('contextmenu',e=>{const a=e.target.closest&&e.target.closest('[data-ti]');if(a){e.preventDefault();const it=tray().items.find(x=>x.id===a.dataset.ti);if(it)openItemEditor(it)}});

/* ---------- 화면 가리기 ---------- */
function tickCover(){if(!document.body.classList.contains('covered'))return;const n=new Date();
  $('#cvClock').textContent=pad(n.getHours())+':'+pad(n.getMinutes());$('#cvDate').textContent=`${n.getMonth()+1}월 ${n.getDate()}일 ${DOW[n.getDay()]}요일`}
function setCover(on){
  document.body.classList.toggle('covered',on);lsSet('tcal.cover',on);$('#cover').setAttribute('aria-hidden',on?'false':'true');
  if(on){$$('.mb').forEach(m=>m.close&&m.close());if(document.activeElement)document.activeElement.blur();tickCover()}
}
setInterval(tickCover,5000);
document.addEventListener('keydown',e=>{if(e.altKey&&(e.key==='h'||e.key==='H'||e.code==='KeyH')){e.preventDefault();setCover(!document.body.classList.contains('covered'))}},true);
document.addEventListener('click',e=>{if(!document.body.classList.contains('covered'))return;if(!e.target.closest('#cover'))return;const b=e.target.closest('[data-act="uncover"]');if(b){e.stopPropagation();setCover(false)}},true);
if(lsGet('tcal.cover',false))setCover(true);

/* ---------- boot ---------- */
async function boot(){
  await loadConfig();S.settings=defaultSettings();
  try{hydrate(await Store.loadAll())}catch(e){}
  await loadShared(false);
  $('#loading').remove();setSave('local');render();refreshMySheets(false);
  setInterval(()=>{if(!document.hidden){loadShared(true);refreshMySheets(false)}},60*60e3);
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
})();
</script>
